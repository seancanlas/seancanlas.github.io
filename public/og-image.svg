<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#090d16"/>
  
  <!-- Background glow -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#bgGrad)" opacity="0.15"/>
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
  </defs>

  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Name -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="72" fill="url(#nameGrad)">Sean Canlas</text>
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#d95c1e"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="600" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="28" fill="#94a3b8" letter-spacing="4" text-transform="uppercase">Full-Stack Software Engineer</text>

  <!-- Divider -->
  <line x1="500" y1="350" x2="700" y2="350" stroke="url(#divGrad)" stroke-width="2"/>
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="50%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#d95c1e"/>
    </linearGradient>
  </defs>

  <!-- Tech tags -->
  <g font-family="system-ui, sans-serif" font-size="18" fill="#64748b">
    <text x="600" y="410" text-anchor="middle">PHP 8.3  •  Symfony 7  •  TypeScript  •  React 18  •  PostgreSQL 16</text>
    <text x="600" y="445" text-anchor="middle" fill="#d95c1e" font-weight="600">Builder of MapleLineCards.ca</text>
  </g>

  <!-- Bottom -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">seancanlas.com  •  github.com/seancanlas  •  linkedin.com/in/seancanlas</text>
</svg>